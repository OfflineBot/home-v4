services:
  backend:
    build:
      context: ./backend
      target: prod
    environment:
      PORT: 8080
      DB_PATH: /data/home.db
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-10080}
      ADMIN_USER: ${ADMIN_USER:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      TOTP_SECRET_KEY: ${TOTP_SECRET_KEY:?}
      WOL_SOCKET: /run/wol/wol.sock
      N8N_URL: http://n8n:5678
      AUTOMATION_BACKEND_URL: http://backend:8080
      STORAGE_DIR: /storage
      GIT_REPOS_DIR: /repos
      GIT_SSH_ADDR: ":${GIT_SSH_PORT:-2222}"
      PAGES_BASE_URL: ${PAGES_BASE_URL:-}
    volumes:
      - backend-data:/data
      - ${STORAGE_PATH:-/data/home-v4/storage}:/storage
      - ${GIT_PATH:-/data/home-v4/git}:/repos
      - wol-socket:/run/wol
    expose:
      - "8080"
    depends_on:
      - wol
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: prod
    environment:
      PORT: 3000
      API_URL: http://backend:8080
      SESSION_COOKIE_SECURE: "true"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  wol:
    build:
      context: ./backend
      target: wol
    network_mode: host
    environment:
      WOL_SOCKET: /run/wol/wol.sock
    volumes:
      - wol-socket:/run/wol
    restart: unless-stopped

  n8n:
    build:
      context: ./n8n
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    depends_on:
      - proxy
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-home.localhost}
      PAGES_ADDRESS: ${PAGES_ADDRESS:-pages.localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    expose:
      - "8080"
      - "8081"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  backend-data:
  caddy-data:
  caddy-config:
  wol-socket:
  n8n-data:
