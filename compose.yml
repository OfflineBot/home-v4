services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      PORT: 8080
      DB_PATH: /data/home.db
    volumes:
      - ./backend:/app
      - ./.data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_URL: http://backend:8080
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
