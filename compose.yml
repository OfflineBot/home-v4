services:
  backend:
    context: ./backend
    target: dev
  environment:
    PORT: 8080
  volumes:
    - ./backend:/app
  ports:
    - "8080:8080"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_URL: https://backend:8080
    volumes: 
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
